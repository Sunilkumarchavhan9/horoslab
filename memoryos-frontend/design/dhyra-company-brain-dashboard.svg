      .header { fill: #050505; }
      .panel { fill: #101011; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .panel2 { fill: #151516; stroke: rgba(255,255,255,0.07); stroke-width: 1; }
      .line { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .blue { fill: #2F80FF; }
      .green { fill: #10B981; }
      .yellow { fill: #F59E0B; }
      .red { fill: #EF4444; }
      .purple { fill: #8B5CF6; }
      .text { fill: #FFFFFF; font-family: Inter, Arial, sans-serif; }
      .muted { fill: rgba(255,255,255,0.48); font-family: Inter, Arial, sans-serif; }
      .soft { fill: rgba(255,255,255,0.68); font-family: Inter, Arial, sans-serif; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .body { font-size: 13px; }
      .title { font-size: 30px; font-weight: 650; }
      .h2 { font-size: 17px; font-weight: 650; }
      .h3 { font-size: 14px; font-weight: 650; }
      .mono { font-family: "SF Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1440" height="900" class="bg"/>

