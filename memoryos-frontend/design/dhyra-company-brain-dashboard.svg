    <circle cx="1122" cy="548" r="16" fill="#101011" stroke="rgba(255,255,255,0.08)"/>
    <text x="1154" y="544" class="text h3">Traceable by design</text>
    <text x="1154" y="564" class="muted small">Every memory is sourced, validated, and provable.</text>
    <circle cx="1122" cy="642" r="16" fill="#101011" stroke="rgba(255,255,255,0.08)"/>
    <text x="1154" y="638" class="text h3">Powering experience</text>
    <text x="1154" y="658" class="muted small">Agents retrieve the right context before acting.</text>
    <circle cx="1122" cy="736" r="16" fill="#101011" stroke="rgba(255,255,255,0.08)"/>
    <text x="1154" y="732" class="text h3">Driving inheritance</text>
    <text x="1154" y="752" class="muted small">Future agents inherit clarity instead of confusion.</text>
