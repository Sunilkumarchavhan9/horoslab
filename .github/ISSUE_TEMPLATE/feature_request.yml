name: Feature Request
description: Propose a new capability or product improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose one clear user problem and one measurable outcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user problem does this solve?
      placeholder: "As a ..., I need ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      placeholder: "Describe the proposed behavior/API/UI"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: "List alternatives and tradeoffs"
  - type: textarea
    id: success
    attributes:
      label: Success Criteria
      description: How will we know this worked?
      placeholder: "Examples: activation +10%, p95 latency < 300ms"
