name: phase1-gate

on:
  workflow_dispatch:

jobs:
  phase1-e2e-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 1 E2E Gate
        env:
          PHASE1_GATE_BASE_URL: ${{ secrets.PHASE1_GATE_BASE_URL }}
          PHASE1_GATE_TOKEN: ${{ secrets.PHASE1_GATE_TOKEN }}
        run: npm run phase1:e2e:gate

      - name: Upload Phase 1 Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-e2e-gate-report
          path: data/eval/reports/phase1-e2e-gate.json

