name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      MEMORY_STORE_PROVIDER: mem0
      JWT_SECRET: ci-release-secret
      JWT_ISSUER: memoryos-ci
      JWT_AUDIENCE: memoryos-api
      MEMORY_STORE_BACKEND: sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Shipping Surfaces)
        run: npm run lint:ci

      - name: Run tests
        run: npm run test

      - name: Eval gate
        run: npm run eval:retrieval

      - name: Baseline compare
        run: npm run eval:compare

      - name: Benchmark report gate
        run: npm run eval:benchmark

      - name: Company Brain Gate (Strict)
        env:
          COMPANY_BRAIN_GATE_STRICT: "true"
          COMPANY_BRAIN_EVAL_MIN_SCORE: "90"
          COMPANY_BRAIN_SCENARIO_MIN_PASS_RATE: "100"
          COMPANY_BRAIN_GATE_REPORT_PATH: "data/eval/reports/company-brain-gate-release.json"
        run: npm run eval:company-brain:gate

      - name: Upload Company Brain Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-brain-gate-release-report
          path: data/eval/reports/company-brain-gate-release.json
