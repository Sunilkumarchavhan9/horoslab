name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      MEMORY_STORE_PROVIDER: mem0
      JWT_SECRET: ci-release-secret
      JWT_ISSUER: memoryos-ci
      JWT_AUDIENCE: memoryos-api
      MEMORY_STORE_BACKEND: sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npx tsc --noEmit -p tsconfig.backend.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Eval gate
        run: npm run eval:retrieval

      - name: Baseline compare
        run: npm run eval:compare

      - name: Benchmark report gate
        run: npm run eval:benchmark
