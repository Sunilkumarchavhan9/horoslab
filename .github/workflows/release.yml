name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      JWT_SECRET: ci-release-secret
      JWT_ISSUER: memoryos-ci
      JWT_AUDIENCE: memoryos-api
      MEMORY_STORE_BACKEND: sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: bun run test

      - name: Eval gate
        run: bun run eval:retrieval

      - name: Baseline compare
        run: bun run eval:compare

