name: Mythic CI

on:
  push:
    branches:
      - feature/mythic-ui-replace
  pull_request:
    branches:
      - feature/mythic-ui-replace

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Next app
        run: npm run build --if-present

      - name: Run unit scripts (handoff & artifact tests)
        run: |
          npx tsx tests/handoff.test.ts
          npx tsx tests/artifactRegistry.test.ts

      - name: Run test suite
        run: npm test

      - name: Snapshot UI render check (headless)
        run: |
          echo "Placeholder: add headless UI snapshot tests in future"
