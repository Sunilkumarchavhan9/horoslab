name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      MEMORY_STORE_PROVIDER: mem0
      JWT_SECRET: ci-test-secret
      JWT_ISSUER: memoryos-ci
      JWT_AUDIENCE: memoryos-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Epoch V12 Contract Artifact
        run: npm run epoch:v12:contract

      - name: Start API For Phase 1 Gate
        env:
          MEMORY_STORE_PROVIDER: local
          MEMORY_STORE_BACKEND: sqlite
        run: |
          npm run dev > .tmp-phase1-api.log 2>&1 &
          echo "PHASE1_API_PID=$!" >> $GITHUB_ENV
          for i in {1..45}; do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Phase 1 gate API did not become healthy in time."
          cat .tmp-phase1-api.log
          exit 1

      - name: Mint Phase 1 Gate Token
        run: |
          TOKEN=$(npm run --silent token -- u_phase1_ci | tail -n 1)
          echo "PHASE1_GATE_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Phase 1 End-to-End Gate
        env:
          PHASE1_GATE_BASE_URL: http://localhost:3001
          PHASE1_GATE_TOKEN: ${{ env.PHASE1_GATE_TOKEN }}
        run: npm run phase1:e2e:gate

      - name: Lint (Shipping Surfaces)
        run: npm run lint:ci

      - name: Unit and E2E Tests
        run: npm run test

      - name: Retrieval Eval Gate
        run: npm run eval:retrieval

      - name: Retrieval Baseline Compare
        run: npm run eval:compare

      - name: Benchmark Report Gate
        run: npm run eval:benchmark

      - name: Company Brain Scenario Dataset Gate
        run: npm run eval:company-brain:scenario-gate

      - name: Company Brain Gate
        env:
          COMPANY_BRAIN_GATE_STRICT: "true"
          COMPANY_BRAIN_GATE_BOOTSTRAP_BASELINE: "true"
          COMPANY_BRAIN_EVAL_MIN_SCORE: "90"
          COMPANY_BRAIN_SCENARIO_MIN_PASS_RATE: "100"
          COMPANY_BRAIN_GATE_REPORT_PATH: "data/eval/reports/company-brain-gate-quality.json"
        run: npm run eval:company-brain:gate

      - name: Upload Company Brain Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-brain-gate-quality-report
          path: data/eval/reports/company-brain-gate-quality.json

      - name: Upload Phase 1 Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-e2e-gate-quality-report
          path: data/eval/reports/phase1-e2e-gate.json

      - name: Upload Phase 1 API Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-api-quality-log
          path: .tmp-phase1-api.log

      - name: Stop Phase 1 Gate API
        if: always()
        run: |
          if [ -n "${PHASE1_API_PID:-}" ]; then
            kill "$PHASE1_API_PID" || true
          fi
