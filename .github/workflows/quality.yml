name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      MEMORY_STORE_PROVIDER: mem0
      JWT_SECRET: ci-test-secret
      JWT_ISSUER: memoryos-ci
      JWT_AUDIENCE: memoryos-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint (Shipping Surfaces)
        run: npm run lint:ci

      - name: Unit and E2E Tests
        run: npm run test

      - name: Retrieval Eval Gate
        run: npm run eval:retrieval

      - name: Retrieval Baseline Compare
        run: npm run eval:compare

      - name: Benchmark Report Gate
        run: npm run eval:benchmark

      - name: Company Brain Gate
        env:
          COMPANY_BRAIN_GATE_STRICT: "true"
          COMPANY_BRAIN_GATE_BOOTSTRAP_BASELINE: "true"
          COMPANY_BRAIN_EVAL_MIN_SCORE: "90"
          COMPANY_BRAIN_SCENARIO_MIN_PASS_RATE: "100"
          COMPANY_BRAIN_GATE_REPORT_PATH: "data/eval/reports/company-brain-gate-quality.json"
        run: npm run eval:company-brain:gate

      - name: Upload Company Brain Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-brain-gate-quality-report
          path: data/eval/reports/company-brain-gate-quality.json
