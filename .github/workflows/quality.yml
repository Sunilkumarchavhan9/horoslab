name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      JWT_SECRET: ci-test-secret
      JWT_ISSUER: memoryos-ci
      JWT_AUDIENCE: memoryos-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint Backend
        run: npm run lint

      - name: Unit and E2E Tests
        run: npm run test

      - name: Retrieval Eval Gate
        run: npm run eval:retrieval

      - name: Retrieval Baseline Compare
        run: npm run eval:compare

      - name: Benchmark Report Gate
        run: npm run eval:benchmark
