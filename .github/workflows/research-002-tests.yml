name: research-002-tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/probe1-stage33-production-readiness
  workflow_dispatch:

jobs:
  research-002:
    name: Research-002 pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize line endings for frozen artifact hashes
        run: |
          python -c "
          import os
          target_dirs = ['research/PROBE-1/Research-002', 'Research-002']
          for td in target_dirs:
              if os.path.isdir(td):
                  for root, _, files in os.walk(td):
                      for f in files:
                          if f.endswith(('.json', '.csv', '.py')) or f == 'phase37_1_epistemic_ood_diagnostic_report.md':
                              p = os.path.join(root, f)
                              with open(p, 'rb') as fp:
                                  data = fp.read()
                              crlf = data.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
                              if crlf != data:
                                  with open(p, 'wb') as fp:
                                      fp.write(crlf)
          "

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Research-002 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.14.1 pytest==8.3.3 pydantic==2.9.2
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Research-002 tests
        run: |
          if [ -d research/PROBE-1/Research-002/tests ]; then
            PYTHONPATH=research/PROBE-1/Research-002:research/PROBE-1/Research-002/src python -m pytest research/PROBE-1/Research-002/tests -q --tb=line
          else
            PYTHONPATH=Research-002:Research-002/src python -m pytest Research-002/tests -q --tb=line
          fi
