name: research-002-tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/probe1-stage33-production-readiness
  workflow_dispatch:

jobs:
  research-002:
    name: Research-002 pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Research-002 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.14.1 pytest==8.3.3 pydantic==2.9.2
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Research-002 tests
        run: |
          if [ -d research/PROBE-1/Research-002/tests ]; then
            python -m pytest research/PROBE-1/Research-002/tests -q --tb=line
          else
            python -m pytest Research-002/tests -q --tb=line
          fi
