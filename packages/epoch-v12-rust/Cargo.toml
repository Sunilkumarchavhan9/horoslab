[package]
name = "epoch-v12-worker"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral Rust worker client for Epoch V12"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Sunilkumarchavhan9/MemoryOS"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
